# Alerte Netdata : le service SOAP ne répond plus (la collecte de /actuator/prometheus échoue)
    alarm: employee_soap_service_injoignable
       on: netdata.go_d_prometheus_employee_soap_service_data_collection_status
    class: Availability
     type: Web Service
component: SOAP
   lookup: max -30s unaligned of failed
    every: 10s
     crit: $this > 0
     info: le service SOAP de gestion des employés ne répond plus
       to: sysadmin
