# Alerte Netdata : le service SOAP ne répond plus.
# Les métriques de /actuator/prometheus ne sont plus collectées depuis plus de 30 s
# (service arrêté ou injoignable). Compatible Netdata 2.x (le graphique interne
# *_data_collection_status n'existe plus pour les jobs prometheus).
    alarm: employee_soap_service_injoignable
       on: prometheus_employee_soap_service.process_uptime_seconds-application=employee-soap-service
    class: Availability
     type: Web Service
component: SOAP
     calc: $now - $last_collected_t
    units: seconds ago
    every: 10s
     crit: $this > 30
     info: le service SOAP de gestion des employés ne répond plus (métriques non collectées depuis plus de 30 s)
       to: sysadmin
