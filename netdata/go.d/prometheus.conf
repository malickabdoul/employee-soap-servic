# Métriques du service SOAP exposées par Spring Boot Actuator (Micrometer)
# cxf_server_requests_seconds_* : nombre d'appels, durée, résultat par opération
jobs:
  - name: employee_soap_service
    url: http://employee-service:8080/actuator/prometheus
    update_every: 5
    autodetection_retry: 10
