server:
  port: 8080

spring:
  application:
    name: employee-soap-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/employes_ref}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app_pwd}
    hikari:
      connection-timeout: 3000
      initialization-fail-timeout: -1

cxf:
  path: /services
  metrics:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: employee-soap-service
    distribution:
      percentiles-histogram:
        cxf.server.requests: true

logging:
  level:
    org.apache.cxf.services: INFO
